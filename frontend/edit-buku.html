<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Buku | LIBMAN</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            <h2>LIBMAN</h2>

            <span>Library Management</span>

        </div>

        <ul class="menu">

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li class="active">

                <a href="buku.html">

                    <i class="fa-solid fa-book"></i>

                    Buku

                </a>

            </li>

            <li>

                <a href="anggota.html">

                    <i class="fa-solid fa-users"></i>

                    Anggota

                </a>

            </li>

            <li>

                <a href="peminjaman.html">

                    <i class="fa-solid fa-book-open-reader"></i>

                    Peminjaman

                </a>

            </li>

            <li>

                <a href="pengembalian.html">

                    <i class="fa-solid fa-arrow-rotate-left"></i>

                    Pengembalian

                </a>

            </li>

            <li>

                <a href="laporan.html">

                    <i class="fa-solid fa-chart-column"></i>

                    Laporan

                </a>

            </li>

        </ul>

        <div class="logout">

            <a href="login.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </aside>

    <!-- ================= CONTENT ================= -->

    <main class="content">

        <header class="topbar">

            <div>

                <h1>Edit Buku</h1>

                <p>Perbarui data buku perpustakaan.</p>

            </div>

            <div class="profile">

                <img src="images/admin.jpg" alt="Admin">

                <div>

                    <h4>Administrator</h4>

                    <span>Perpustakaan</span>

                </div>

            </div>

        </header>

        <div class="form-card">

            <h2>Form Edit Buku</h2>

            <form id="bookForm">

                <div class="form-group">

                    <label>Judul Buku</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Masukkan Judul Buku"
                        required>

                </div>

                <div class="form-group">

                    <label>Penulis</label>

                    <input
                        type="text"
                        id="author"
                        placeholder="Nama Penulis"
                        required>

                </div>

                <div class="form-group">

                    <label>Penerbit</label>

                    <input
                        type="text"
                        id="publisher"
                        placeholder="Nama Penerbit"
                        required>

                </div>

                <div class="form-group">

                    <label>Tahun Terbit</label>

                    <input
                        type="number"
                        id="publicationYear"
                        placeholder="2026"
                        required>

                </div>

                <div class="form-group">

                    <label>Kategori</label>

                    <select id="categoryId" required>

                        <option value="">-- Pilih Kategori --</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>ISBN</label>

                    <input
                        type="text"
                        id="isbn"
                        placeholder="978xxxxxxxx"
                        required>

                </div>

                <div class="form-group">

                    <label>Jumlah Stok</label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="10"
                        required>

                </div>

                <button type="submit" class="btn-primary">

                    <i class="fa-solid fa-pen"></i>

                    Update Buku

                </button>

                <a href="buku.html" class="btn-cancel">

                    Batal

                </a>

            </form>

        </div>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/edit-book.js"></script>

</body>
</html>
