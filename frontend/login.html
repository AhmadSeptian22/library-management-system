<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBMAN - Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:#f5f7fb;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            width:420px;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        .logo{
            text-align:center;
            margin-bottom:35px;
        }

        .logo h2{
            font-size:28px;
            color:#111;
            margin-bottom:5px;
        }

        .logo p{
            color:gray;
            font-size:12px;
            letter-spacing:2px;
        }

        h3{
            margin-bottom:30px;
            color:#333;
            font-size:24px;
        }

        label{
            display:block;
            margin-top:18px;
            margin-bottom:8px;
            font-size:13px;
            color:#555;
        }

        input{
            width:100%;
            padding:13px;
            border:1px solid #dcdcdc;
            border-radius:5px;
            outline:none;
            font-size:14px;
        }

        input:focus{
            border:1px solid #2d7ef7;
        }

        .remember{
            margin-top:18px;
            display:flex;
            align-items:center;
            gap:10px;
            font-size:13px;
            color:#666;
        }

        .remember input{
            width:auto;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            background:#0d6efd;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
            transition:.3s;
        }

        button:hover{
            background:#0056d2;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            font-size:12px;
            color:#888;
        }
    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        <h2>LIBMAN</h2>
        <p>LIBRARY MANAGEMENT</p>
    </div>

    <h3>Portal Admin</h3>

    <form onsubmit="login(event)">

        <label>Username / Email</label>

        <input
            type="text"
            id="username"
            placeholder="Masukkan Username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan Password"
            required
        >

        <div class="remember">

            <input type="checkbox">

            <span>Ingat saya</span>

        </div>

        <button type="submit">
            Masuk →
        </button>

    </form>

    <div class="footer">

        © 2026 LIBMAN

    </div>

</div>

<script>

async function login(event){

    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try{

        const response = await fetch("http://localhost:8080/api/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:username,
                password:password

            })

        });

        const result = await response.json();

        if(result.success){

            localStorage.setItem("token",result.data.token);

            window.location.href="dashboard.html";

        }else{

            alert(result.message);

        }

    }catch(error){

        console.error(error);

        alert("Backend tidak dapat dihubungi.");

    }

}

</script>
</body>
</html>
